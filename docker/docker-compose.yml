# 应用 Compose（外部 MySQL/Redis）。数据库地址通过 MYSQL_SERVICE_HOST、REDIS_SERVICE_HOST 配置，
# 本文件不依赖或创建其它 Compose 项目。
name: ${DEPLOY_PROJECT:-tianshu}

x-java: &java
  image: ${JAVA_IMAGE:-eclipse-temurin:17-jre-jammy}
  restart: unless-stopped
  init: true
  working_dir: /app
  environment: &java-env
    TZ: Asia/Shanghai
    SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SHUTDOWN_TIMEOUT:-120s}
    LOGGING_FILE_NAME: /data/logs/application.log
  stop_grace_period: 180s
  logging:
    driver: json-file
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
      max-file: "${DOCKER_LOG_MAX_FILES:-5}"
  networks: [rule-engine]
  extra_hosts:
    - host.docker.internal:host-gateway

x-runtime: &runtime
  <<: *java
  volumes:
    - type: bind
      source: ${RUNTIME_DIR:-./tianshu-decision-engine-runtime}/runtime.jar
      target: /app/app.jar
      read_only: true
      bind:
        create_host_path: false

services:
  server:
    <<: *java
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      MYSQL_HOST: ${MYSQL_SERVICE_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rule_engine}
      MYSQL_USERNAME: "${MYSQL_USERNAME:?Set MYSQL_USERNAME}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      REDIS_HOST: ${REDIS_SERVICE_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_SERVICE_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      SPRING_SQL_INIT_MODE: never
      RULE_AUTH_MASTER_KEY: "${RULE_AUTH_MASTER_KEY:?Set RULE_AUTH_MASTER_KEY}"
      RULE_AUTH_ACTIVE_KEY_ID: ${RULE_AUTH_ACTIVE_KEY_ID:-v2}
      RULE_AUTH_LEGACY_MASTER_KEY: ${RULE_AUTH_LEGACY_MASTER_KEY:-}
      RULE_AUTH_LEGACY_V2_MASTER_KEY: ${RULE_AUTH_LEGACY_V2_MASTER_KEY:-}
      CONSOLE_USERNAME: "${CONSOLE_USERNAME:?Set CONSOLE_USERNAME}"
      CONSOLE_PASSWORD: "${CONSOLE_PASSWORD:?Set CONSOLE_PASSWORD}"
      CONSOLE_PASSWORD_ENCODING: ${CONSOLE_PASSWORD_ENCODING:-BCRYPT}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_REDIS_NAMESPACE: ${SESSION_REDIS_NAMESPACE:-tianshu:session}
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:?Set CORS_ALLOWED_ORIGIN_PATTERNS}"
      JAVA_TOOL_OPTIONS: ${SERVER_JAVA_TOOL_OPTIONS:--Xms256m -Xmx1536m -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=256m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${SERVER_LOG_LEVEL:-INFO}
      RULE_EXECUTION_PERSISTENCE_JOURNAL_DIR: /data/logs/execution-persistence-journal
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./tianshu-decision-engine-runtime}/server.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - server-logs:/data/logs
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${SERVER_PUBLIC_PORT:-8080}:8080"
    expose: ["8080"]

  runtime-http:
    <<: *runtime
    depends_on:
      server:
        condition: service_started
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: http
      SERVER_PORT: 7070
      RULE_SERVER_URL: ${RUNTIME_RULE_SERVER_URL:-http://server:8080}
      PROJECT_ACCESS_TOKEN: "${RUNTIME_PROJECT_ACCESS_TOKEN:?Set RUNTIME_PROJECT_ACCESS_TOKEN}"
      RULE_ALLOWED_CODES: "${HTTP_RULE_ALLOWED_CODES:?Set HTTP_RULE_ALLOWED_CODES}"
      RULE_TRACE_ENABLED: ${RUNTIME_TRACE_ENABLED:-true}
      RULE_HTTP_TIMEOUT_MS: ${RULE_HTTP_TIMEOUT_MS:-30000}
      RUNTIME_ACCESS_TOKEN: "${HTTP_ACCESS_TOKEN:?Set HTTP_ACCESS_TOKEN}"
      RUNTIME_APP_NAME: ${RUNTIME_HTTP_APP_NAME:-runtime-http}
      RUNTIME_CORS_ALLOWED_ORIGINS: "${RUNTIME_CORS_ALLOWED_ORIGINS:?Set RUNTIME_CORS_ALLOWED_ORIGINS}"
      JAVA_TOOL_OPTIONS: ${RUNTIME_HTTP_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${RUNTIME_LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./tianshu-decision-engine-runtime}/runtime.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - runtime-http-logs:/data/logs
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${RUNTIME_HTTP_PORT:-7070}:7070"
    expose: ["7070"]

  runtime-sdk:
    <<: *runtime
    depends_on:
      server:
        condition: service_started
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: sdk
      SERVER_PORT: 7071
      RULE_SERVER_URL: ${RUNTIME_RULE_SERVER_URL:-http://server:8080}
      PROJECT_ACCESS_TOKEN: "${RUNTIME_PROJECT_ACCESS_TOKEN:?Set RUNTIME_PROJECT_ACCESS_TOKEN}"
      RULE_ALLOWED_CODES: "${SDK_RULE_ALLOWED_CODES:?Set SDK_RULE_ALLOWED_CODES}"
      RULE_TRACE_ENABLED: ${RUNTIME_TRACE_ENABLED:-true}
      RULE_HTTP_TIMEOUT_MS: ${RULE_HTTP_TIMEOUT_MS:-30000}
      RUNTIME_ACCESS_TOKEN: "${SDK_ACCESS_TOKEN:?Set SDK_ACCESS_TOKEN}"
      RUNTIME_APP_NAME: ${RUNTIME_SDK_APP_NAME:-runtime-sdk}
      RUNTIME_CORS_ALLOWED_ORIGINS: "${RUNTIME_CORS_ALLOWED_ORIGINS:?Set RUNTIME_CORS_ALLOWED_ORIGINS}"
      RULE_PROJECT_CODE: "${RUNTIME_RULE_PROJECT_CODE:?Set RUNTIME_RULE_PROJECT_CODE}"
      RULE_PROJECT_ID: "${RUNTIME_RULE_PROJECT_ID:?Set RUNTIME_RULE_PROJECT_ID}"
      SDK_CACHE_MAX_SIZE: ${SDK_CACHE_MAX_SIZE:-1000}
      SDK_LOG_REPORT_ENABLED: ${SDK_LOG_REPORT_ENABLED:-true}
      REDIS_HOST: ${REDIS_SERVICE_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_SERVICE_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      SPRING_DATA_REDIS_HOST: ${REDIS_SERVICE_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_SERVICE_PORT:-6379}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      JAVA_TOOL_OPTIONS: ${RUNTIME_SDK_JAVA_TOOL_OPTIONS:--Xms128m -Xmx768m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=160m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${RUNTIME_LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./tianshu-decision-engine-runtime}/runtime.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - runtime-sdk-logs:/data/logs
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${RUNTIME_SDK_PORT:-7071}:7071"
    expose: ["7071"]

  web:
    image: ${NGINX_IMAGE:-nginx:1.29.1-alpine}
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_started
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./tianshu-decision-engine-runtime}/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/sh
      - -ec
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          client_max_body_size 512m;
          location /api/ {
            proxy_pass http://server:8080;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
          location / {
            try_files $$uri $$uri/ /index.html;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    ports:
      - "${FRONTEND_PORT:-9090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/index.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rule-engine]

volumes:
  server-logs:
  runtime-http-logs:
  runtime-sdk-logs:

networks:
  rule-engine:
    name: ${ENGINE_NETWORK:-${DEPLOY_PROJECT:-tianshu}-engine}
    driver: bridge
