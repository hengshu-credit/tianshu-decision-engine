# 方案 C：应用 Compose（外部 MySQL/Redis）。数据库地址使用统一的 MYSQL_HOST/MYSQL_PORT、REDIS_HOST/REDIS_PORT。
# 本文件独立启动 server、HTTP runtime、SDK runtime 和 web，不创建 MySQL/Redis。
# 使用 DEPLOY_PROJECT 为每套部署隔离 Compose 项目、网络和卷；不要与 full Compose 共用同一个项目名。
# 资源硬上限：server 3G/1.00C、runtime-http 768M/0.10C、runtime-sdk 1280M/0.15C、web 256M/0.05C；
# 本文件按 2 个 server 副本合计约 4.50G 内存、1.20C CPU；外接 Kafka/MySQL/Redis 时整体按 8G/2C 预算。
name: ${DEPLOY_PROJECT:-tianshu}

x-java: &java
  image: ${JAVA_IMAGE:-eclipse-temurin:17-jre-jammy}
  restart: unless-stopped
  init: true
  working_dir: /app
  environment: &java-env
    TZ: Asia/Shanghai
    SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SHUTDOWN_TIMEOUT:-120s}
    LOGGING_FILE_NAME: ""
  stop_grace_period: 180s
  logging:
    driver: json-file
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: "${DOCKER_LOG_MAX_FILES:-3}"
  networks: [rule-engine]
  extra_hosts:
    - host.docker.internal:host-gateway

x-runtime: &runtime
  <<: *java
  volumes:
    - type: bind
      source: ${RUNTIME_DIR:-./runtime}/runtime.jar
      target: /app/app.jar
      read_only: true
      bind:
        create_host_path: false

services:
  server:
    <<: *java
    scale: ${SERVER_REPLICAS:-2}
    cpus: "0.45"
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 1536M
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rule_engine}
      MYSQL_USERNAME: "${MYSQL_USERNAME:?Set MYSQL_USERNAME}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}
      RULE_ENGINE_INITIAL_DATA_ENABLED: ${RULE_ENGINE_INITIAL_DATA_ENABLED:-false}
      RULE_ENGINE_INITIAL_DATA_LOCATION: ${RULE_ENGINE_INITIAL_DATA_LOCATION:-classpath:sql/initial-data.sql}
      RULE_TRACE_MAX_PERSIST_BYTES: ${RULE_TRACE_MAX_PERSIST_BYTES:-0}
      RULE_EXECUTION_PERSISTENCE_JOURNAL_ENABLED: ${RULE_EXECUTION_PERSISTENCE_JOURNAL_ENABLED:-true}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      RULE_KAFKA_ENABLED: ${RULE_KAFKA_ENABLED:-false}
      RULE_KAFKA_GROUP_ID: ${RULE_KAFKA_GROUP_ID:-rule-engine-server}
      SPRING_APPLICATION_JSON: "${KAFKA_SERVER_APPLICATION_JSON:-}"
      RULE_AUTH_MASTER_KEY: "${RULE_AUTH_MASTER_KEY:?Set RULE_AUTH_MASTER_KEY}"
      RULE_GLOBAL_ACCESS_ENABLED: ${RULE_GLOBAL_ACCESS_ENABLED:-true}
      RULE_GLOBAL_ACCESS_KEY_ID: ${RULE_GLOBAL_ACCESS_KEY_ID:-default}
      RULE_GLOBAL_ACCESS_PUBLIC_KEY: ${RULE_GLOBAL_ACCESS_PUBLIC_KEY:-}
      RULE_GLOBAL_ACCESS_TIME_WINDOW_SECONDS: ${RULE_GLOBAL_ACCESS_TIME_WINDOW_SECONDS:-300}
      CONSOLE_USERNAME: "${CONSOLE_USERNAME:?Set CONSOLE_USERNAME}"
      CONSOLE_PASSWORD: "${CONSOLE_PASSWORD:?Set CONSOLE_PASSWORD}"
      CONSOLE_PASSWORD_ENCODING: ${CONSOLE_PASSWORD_ENCODING:-BCRYPT}
      SESSION_REDIS_NAMESPACE: ${SESSION_REDIS_NAMESPACE:-tianshu:session}
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:?Set CORS_ALLOWED_ORIGIN_PATTERNS}"
      LOGGING_FILE_NAME: ""
      JAVA_TOOL_OPTIONS: ${SERVER_JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=256m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${SERVER_LOG_LEVEL:-WARN}
      RULE_EXECUTION_PERSISTENCE_JOURNAL_DIR: /data/logs/execution-persistence-journal
      RULE_LIST_ACTION_JOURNAL_DIR: /data/logs/list-action-journal
      RULE_LIST_ACTION_JOURNAL_SCAN_PARENT: "true"
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/server.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - server-logs:/data/logs
    command:
      - sh
      - -ec
      - |
        export RULE_EXECUTION_PERSISTENCE_JOURNAL_DIR="/data/logs/execution-persistence-journal/$${HOSTNAME}"
        export RULE_LIST_ACTION_JOURNAL_DIR="/data/logs/list-action-journal/$${HOSTNAME}"
        exec java -jar /app/app.jar
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 12

  runtime-http:
    <<: *runtime
    cpus: "0.10"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 512M
    depends_on:
      server:
        condition: service_started
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: http
      SERVER_PORT: 7070
      RULE_SERVER_URL: "${RUNTIME_RULE_SERVER_URL:?Set RUNTIME_RULE_SERVER_URL to server IP:port or NPM URL}"
      RULE_AUTH_TYPE: ${RULE_AUTH_TYPE:-GLOBAL_KEY}
      PROJECT_ACCESS_TOKEN: ${RUNTIME_PROJECT_ACCESS_TOKEN:-}
      RULE_GLOBAL_KEY_ID: ${RULE_GLOBAL_KEY_ID:-default}
      RULE_GLOBAL_PRIVATE_KEY: ${RULE_GLOBAL_PRIVATE_KEY:-}
      RULE_ALLOWED_CODES: "${HTTP_RULE_ALLOWED_CODES:-}"
      RULE_TRACE_ENABLED: ${RUNTIME_TRACE_ENABLED:-false}
      RULE_HTTP_TIMEOUT_MS: ${RULE_HTTP_TIMEOUT_MS:-30000}
      RUNTIME_ACCESS_TOKEN: "${HTTP_ACCESS_TOKEN:?Set HTTP_ACCESS_TOKEN}"
      RUNTIME_APP_NAME: runtime-http
      RUNTIME_CORS_ALLOWED_ORIGINS: "${RUNTIME_CORS_ALLOWED_ORIGINS:?Set RUNTIME_CORS_ALLOWED_ORIGINS}"
      JAVA_TOOL_OPTIONS: ${RUNTIME_HTTP_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${RUNTIME_LOG_LEVEL:-WARN}
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/runtime.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - runtime-http-logs:/data/logs
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${RUNTIME_HTTP_PORT:-7070}:7070"
    expose: ["7070"]

  runtime-sdk:
    <<: *runtime
    cpus: "0.15"
    mem_limit: 768m
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 768M
    depends_on:
      server:
        condition: service_started
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: sdk
      SERVER_PORT: 7071
      RULE_SERVER_URL: "${RUNTIME_RULE_SERVER_URL:?Set RUNTIME_RULE_SERVER_URL to server IP:port or NPM URL}"
      RULE_AUTH_TYPE: ${RULE_AUTH_TYPE:-GLOBAL_KEY}
      PROJECT_ACCESS_TOKEN: ${RUNTIME_PROJECT_ACCESS_TOKEN:-}
      RULE_GLOBAL_KEY_ID: ${RULE_GLOBAL_KEY_ID:-default}
      RULE_GLOBAL_PRIVATE_KEY: ${RULE_GLOBAL_PRIVATE_KEY:-}
      RULE_ALLOWED_CODES: "${SDK_RULE_ALLOWED_CODES:-}"
      RULE_TRACE_ENABLED: ${RUNTIME_TRACE_ENABLED:-false}
      RULE_HTTP_TIMEOUT_MS: ${RULE_HTTP_TIMEOUT_MS:-30000}
      RUNTIME_ACCESS_TOKEN: "${SDK_ACCESS_TOKEN:?Set SDK_ACCESS_TOKEN}"
      RUNTIME_APP_NAME: runtime-sdk
      RUNTIME_CORS_ALLOWED_ORIGINS: "${RUNTIME_CORS_ALLOWED_ORIGINS:?Set RUNTIME_CORS_ALLOWED_ORIGINS}"
      RULE_PROJECT_CODE: ${RUNTIME_RULE_PROJECT_CODE:-}
      RULE_PROJECT_ID: ${RUNTIME_RULE_PROJECT_ID:-}
      SDK_CACHE_MAX_SIZE: ${SDK_CACHE_MAX_SIZE:-1000}
      SDK_LOG_REPORT_ENABLED: ${SDK_LOG_REPORT_ENABLED:-true}
      SDK_LOG_REPORT_TRANSPORT: ${SDK_LOG_REPORT_TRANSPORT:-HTTP}
      SDK_KAFKA_LOG_TOPIC: ${SDK_KAFKA_LOG_TOPIC:-rule-execution-log}
      SDK_KAFKA_HTTP_FALLBACK_ENABLED: ${SDK_KAFKA_HTTP_FALLBACK_ENABLED:-true}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      SPRING_APPLICATION_JSON: "${KAFKA_SDK_APPLICATION_JSON:-}"
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      JAVA_TOOL_OPTIONS: ${RUNTIME_SDK_JAVA_TOOL_OPTIONS:--Xms128m -Xmx768m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=160m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${RUNTIME_LOG_LEVEL:-WARN}
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/runtime.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - runtime-sdk-logs:/data/logs
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${RUNTIME_SDK_PORT:-7071}:7071"
    expose: ["7071"]

  web:
    image: ${NGINX_IMAGE:-nginx:1.29.1-alpine}
    cpus: "0.05"
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/proxy.conf
        target: /etc/nginx/tianshu-proxy.conf
        read_only: true
        bind:
          create_host_path: false
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-9090}:80"
      - "${SERVER_PUBLIC_BIND_ADDRESS:-127.0.0.1}:${SERVER_PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/index.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rule-engine]

volumes:
  server-logs:
  runtime-http-logs:
  runtime-sdk-logs:

networks:
  rule-engine:
    name: ${ENGINE_NETWORK:-${DEPLOY_PROJECT:-tianshu}-engine}
    driver: bridge
