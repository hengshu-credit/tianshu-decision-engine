# 依赖组件 Compose：只启动 Redis，供 JAR、单容器 Docker 或外接数据库应用 Compose 使用。
# 它不启动 server/web，也不依赖其它 Compose；使用 DEPLOY_PROJECT 隔离多套环境。
# 固定上限：384M 内存、0.10C CPU；与应用/MySQL/Kafka Compose 同时运行时按 8G/2C 预算。
name: ${DEPLOY_PROJECT:-tianshu}

services:
  redis:
    image: ${REDIS_IMAGE:-redis:8.2.1}
    cpus: "0.10"
    mem_limit: 384m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 384M
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      TZ: Asia/Shanghai
    command:
      - sh
      - -ec
      - |
        exec redis-server /usr/local/etc/redis/redis.conf --maxmemory "$${REDIS_MAXMEMORY}" --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${REDIS_BIND_ADDRESS:-0.0.0.0}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./rule-engine-redis/data:/data
      - ./rule-engine-redis/logs:/logs
      - ./rule-engine-redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    networks: [rule-engine]

networks:
  rule-engine:
    name: ${ENGINE_NETWORK:-${DEPLOY_PROJECT:-tianshu}-engine}
    driver: bridge


