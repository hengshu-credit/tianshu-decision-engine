# 方案 D：一键完整 Compose，包含 MySQL + Redis + server + HTTP + SDK + web。
# 本文件独立启动所有依赖，不需要先启动 mysql/redis Compose；用 DEPLOY_PROJECT 隔离多套环境。
# 默认拓扑：server 2 个副本；HTTP runtime、SDK runtime、MySQL、Redis、Kafka、web 各 1 个。
# 资源硬上限：mysql 1.5G/0.40C、redis 384M/0.10C、kafka 1G/0.25C、
# 每个 server 1.5G/0.45C、http 512M/0.10C、sdk 768M/0.15C、web 256M/0.05C；
# 2 个 server 时合计约 7.38G 内存、1.95C CPU；启用 example-data profile 后增加 256M/0.05C。
name: ${DEPLOY_PROJECT:-tianshu}

x-java: &java
  image: ${JAVA_IMAGE:-eclipse-temurin:17-jre-jammy}
  restart: unless-stopped
  init: true
  working_dir: /app
  environment: &java-env
    TZ: Asia/Shanghai
    SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SHUTDOWN_TIMEOUT:-120s}
    LOGGING_FILE_NAME: ""
  stop_grace_period: 180s
  logging:
    driver: json-file
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: "${DOCKER_LOG_MAX_FILES:-3}"
  networks: [rule-engine]
  extra_hosts:
    - host.docker.internal:host-gateway

x-runtime: &runtime
  <<: *java
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
    start_period: 120s
    interval: 10s
    timeout: 5s
    retries: 12
  volumes:
    - type: bind
      source: ${RUNTIME_DIR:-./runtime}/runtime.jar
      target: /app/app.jar
      read_only: true
      bind:
        create_host_path: false

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.6}
    cpus: "0.40"
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 1536M
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-rule_engine}"
      MYSQL_USER: "${MYSQL_USERNAME:?Set MYSQL_USERNAME}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      TZ: Asia/Shanghai
    command:
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-300}
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-1G}
      - --max-allowed-packet=512M
      - --character-set-server=utf8mb4
      - --mysql-native-password=ON
      - --bind-address=${MYSQL_BIND_ADDRESS:-0.0.0.0}
    ports:
      - "${MYSQL_BIND_ADDRESS:-0.0.0.0}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ./rule-engine-mysql/data:/var/lib/mysql
      - ./rule-engine-mysql/logs:/var/log/mysql
      - ./rule-engine-mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    networks: [rule-engine]

  example-data-import:
    image: ${MYSQL_IMAGE:-mysql:8.4.6}
    profiles: [example-data]
    cpus: "0.05"
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M
    restart: "no"
    environment:
      MYSQL_USERNAME: "${MYSQL_USERNAME:?Set MYSQL_USERNAME}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rule_engine}
    depends_on:
      mysql:
        condition: service_healthy
      server:
        condition: service_started
    volumes:
      - type: bind
        source: ./rule-engine-mysql/data-tianshu-example.sql
        target: /init/data-tianshu-example.sql
        read_only: true
        bind:
          create_host_path: false
    command:
      - sh
      - -ec
      - |
        until MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp -hmysql -P3306 -u"$${MYSQL_USERNAME}" -Nse "SELECT 1 FROM information_schema.tables WHERE table_schema='$${MYSQL_DATABASE}' AND table_name='offline_transfer_log' LIMIT 1" | grep -q 1; do sleep 2; done
        MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp -hmysql -P3306 -u"$${MYSQL_USERNAME}" "$${MYSQL_DATABASE}" < /init/data-tianshu-example.sql
    networks: [rule-engine]

  redis:
    image: ${REDIS_IMAGE:-redis:8.2.1}
    cpus: "0.10"
    mem_limit: 384m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 384M
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      TZ: Asia/Shanghai
    command:
      - sh
      - -ec
      - |
        exec redis-server /usr/local/etc/redis/redis.conf --maxmemory "$${REDIS_MAXMEMORY}" --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${REDIS_BIND_ADDRESS:-0.0.0.0}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./rule-engine-redis/data:/data
      - ./rule-engine-redis/logs:/logs
      - ./rule-engine-redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    networks: [rule-engine]

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.2}
    restart: unless-stopped
    init: true
    scale: 1
    cpus: "0.25"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      KAFKA_ADVERTISED_HOST: "${KAFKA_ADVERTISED_HOST:?Set KAFKA_ADVERTISED_HOST}"
      KAFKA_HOST_PORT: ${KAFKA_HOST_PORT:-9092}
      KAFKA_USERNAME: "${KAFKA_USERNAME:?Set KAFKA_USERNAME}"
      KAFKA_PASSWORD: "${KAFKA_PASSWORD:?Set KAFKA_PASSWORD}"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_OPTS: -XX:ActiveProcessorCount=2
    entrypoint: ["/bin/bash", "/opt/tianshu/start-kafka.sh"]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./rule-engine-kafka/start-kafka.sh:/opt/tianshu/start-kafka.sh:ro
    ports:
      - "${KAFKA_BIND_ADDRESS:-0.0.0.0}:${KAFKA_HOST_PORT:-9092}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --command-config /tmp/tianshu-client.properties --list >/dev/null"]
      start_period: 90s
      interval: 30s
      timeout: 20s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    networks: [rule-engine]

  server:
    <<: *java
    scale: ${SERVER_REPLICAS:-2}
    cpus: "0.45"
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 1536M
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rule_engine}
      MYSQL_USERNAME: "${MYSQL_USERNAME:?Set MYSQL_USERNAME}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}
      RULE_ENGINE_INITIAL_DATA_ENABLED: ${RULE_ENGINE_INITIAL_DATA_ENABLED:-false}
      RULE_ENGINE_INITIAL_DATA_LOCATION: ${RULE_ENGINE_INITIAL_DATA_LOCATION:-classpath:sql/initial-data.sql}
      RULE_TRACE_MAX_PERSIST_BYTES: ${RULE_TRACE_MAX_PERSIST_BYTES:-0}
      RULE_EXECUTION_PERSISTENCE_JOURNAL_ENABLED: ${RULE_EXECUTION_PERSISTENCE_JOURNAL_ENABLED:-true}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      RULE_KAFKA_ENABLED: ${RULE_KAFKA_ENABLED:-false}
      RULE_KAFKA_GROUP_ID: ${RULE_KAFKA_GROUP_ID:-rule-engine-server}
      SPRING_APPLICATION_JSON: "${KAFKA_SERVER_APPLICATION_JSON:-}"
      RULE_AUTH_MASTER_KEY: "${RULE_AUTH_MASTER_KEY:?Set RULE_AUTH_MASTER_KEY}"
      RULE_GLOBAL_ACCESS_ENABLED: ${RULE_GLOBAL_ACCESS_ENABLED:-true}
      RULE_GLOBAL_ACCESS_KEY_ID: ${RULE_GLOBAL_ACCESS_KEY_ID:-default}
      RULE_GLOBAL_ACCESS_PUBLIC_KEY: ${RULE_GLOBAL_ACCESS_PUBLIC_KEY:-}
      RULE_GLOBAL_ACCESS_TIME_WINDOW_SECONDS: ${RULE_GLOBAL_ACCESS_TIME_WINDOW_SECONDS:-300}
      SESSION_REDIS_NAMESPACE: ${SESSION_REDIS_NAMESPACE:-tianshu:session}
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:?Set CORS_ALLOWED_ORIGIN_PATTERNS}"
      LOGGING_FILE_NAME: ""
      JAVA_TOOL_OPTIONS: ${SERVER_JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=256m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${SERVER_LOG_LEVEL:-WARN}
      RULE_EXECUTION_PERSISTENCE_JOURNAL_DIR: /data/logs/execution-persistence-journal
      RULE_LIST_ACTION_JOURNAL_DIR: /data/logs/list-action-journal
      RULE_LIST_ACTION_JOURNAL_SCAN_PARENT: "true"
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/server.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - server-logs:/data/logs
    command:
      - sh
      - -ec
      - |
        export RULE_EXECUTION_PERSISTENCE_JOURNAL_DIR="/data/logs/execution-persistence-journal/$${HOSTNAME}"
        export RULE_LIST_ACTION_JOURNAL_DIR="/data/logs/list-action-journal/$${HOSTNAME}"
        exec java -jar /app/app.jar
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 12

  http:
    <<: *runtime
    cpus: "0.10"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 512M
    depends_on:
      server:
        condition: service_started
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: http
      SERVER_PORT: 7070
      RULE_SERVER_URL: "${RUNTIME_RULE_SERVER_URL:?Set RUNTIME_RULE_SERVER_URL to server IP:port or NPM URL}"
      RULE_AUTH_TYPE: ${RULE_AUTH_TYPE:-GLOBAL_KEY}
      PROJECT_ACCESS_TOKEN: ${RUNTIME_PROJECT_ACCESS_TOKEN:-}
      RULE_GLOBAL_KEY_ID: ${RULE_GLOBAL_KEY_ID:-default}
      RULE_GLOBAL_PRIVATE_KEY: ${RULE_GLOBAL_PRIVATE_KEY:-}
      RULE_ALLOWED_CODES: "${HTTP_RULE_ALLOWED_CODES:-}"
      RULE_TRACE_ENABLED: ${RUNTIME_TRACE_ENABLED:-false}
      RULE_HTTP_TIMEOUT_MS: ${RULE_HTTP_TIMEOUT_MS:-30000}
      RUNTIME_ACCESS_TOKEN: "${HTTP_ACCESS_TOKEN:?Set HTTP_ACCESS_TOKEN}"
      RUNTIME_APP_NAME: runtime-http
      RUNTIME_CORS_ALLOWED_ORIGINS: "${RUNTIME_CORS_ALLOWED_ORIGINS:?Set RUNTIME_CORS_ALLOWED_ORIGINS}"
      JAVA_TOOL_OPTIONS: ${RUNTIME_HTTP_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${RUNTIME_LOG_LEVEL:-WARN}
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/runtime.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - runtime-http-logs:/data/logs
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${RUNTIME_HTTP_PORT:-7070}:7070"
    expose: ["7070"]

  sdk:
    <<: *runtime
    cpus: "0.15"
    mem_limit: 768m
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 768M
    depends_on:
      server:
        condition: service_started
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: sdk
      SERVER_PORT: 7071
      RULE_SERVER_URL: "${RUNTIME_RULE_SERVER_URL:?Set RUNTIME_RULE_SERVER_URL to server IP:port or NPM URL}"
      RULE_AUTH_TYPE: ${RULE_AUTH_TYPE:-GLOBAL_KEY}
      PROJECT_ACCESS_TOKEN: ${RUNTIME_PROJECT_ACCESS_TOKEN:-}
      RULE_GLOBAL_KEY_ID: ${RULE_GLOBAL_KEY_ID:-default}
      RULE_GLOBAL_PRIVATE_KEY: ${RULE_GLOBAL_PRIVATE_KEY:-}
      RULE_ALLOWED_CODES: "${SDK_RULE_ALLOWED_CODES:-}"
      RULE_TRACE_ENABLED: ${RUNTIME_TRACE_ENABLED:-false}
      RULE_HTTP_TIMEOUT_MS: ${RULE_HTTP_TIMEOUT_MS:-30000}
      RUNTIME_ACCESS_TOKEN: "${SDK_ACCESS_TOKEN:?Set SDK_ACCESS_TOKEN}"
      RUNTIME_APP_NAME: runtime-sdk
      RUNTIME_CORS_ALLOWED_ORIGINS: "${RUNTIME_CORS_ALLOWED_ORIGINS:?Set RUNTIME_CORS_ALLOWED_ORIGINS}"
      RULE_PROJECT_CODE: ${RUNTIME_RULE_PROJECT_CODE:-}
      RULE_PROJECT_ID: ${RUNTIME_RULE_PROJECT_ID:-}
      SDK_CACHE_MAX_SIZE: ${SDK_CACHE_MAX_SIZE:-1000}
      SDK_LOG_REPORT_ENABLED: ${SDK_LOG_REPORT_ENABLED:-true}
      SDK_LOG_REPORT_TRANSPORT: ${SDK_LOG_REPORT_TRANSPORT:-HTTP}
      SDK_KAFKA_LOG_TOPIC: ${SDK_KAFKA_LOG_TOPIC:-rule-execution-log}
      SDK_KAFKA_HTTP_FALLBACK_ENABLED: ${SDK_KAFKA_HTTP_FALLBACK_ENABLED:-true}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_APPLICATION_JSON: "${KAFKA_SDK_APPLICATION_JSON:-}"
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      JAVA_TOOL_OPTIONS: ${RUNTIME_SDK_JAVA_TOOL_OPTIONS:--Xms128m -Xmx768m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=160m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ROOT: ${RUNTIME_LOG_LEVEL:-WARN}
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/runtime.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - runtime-sdk-logs:/data/logs
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${RUNTIME_SDK_PORT:-7071}:7071"
    expose: ["7071"]

  web:
    image: ${NGINX_IMAGE:-nginx:1.29.1-alpine}
    cpus: "0.05"
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/proxy.conf
        target: /etc/nginx/tianshu-proxy.conf
        read_only: true
        bind:
          create_host_path: false
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-9090}:80"
      - "${SERVER_PUBLIC_BIND_ADDRESS:-127.0.0.1}:${SERVER_PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/index.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rule-engine]

volumes:
  server-logs:
  runtime-http-logs:
  runtime-sdk-logs:
  kafka-data:

networks:
  rule-engine:
    name: ${ENGINE_NETWORK:-${DEPLOY_PROJECT:-tianshu}-engine}
    driver: bridge
