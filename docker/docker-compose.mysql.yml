# 依赖组件 Compose：只启动 MySQL，供 JAR、单容器 Docker 或外接数据库应用 Compose 使用。
# 它不启动 server/web，也不依赖其它 Compose；使用 DEPLOY_PROJECT 隔离多套环境。
# 容器 CPU 和内存上限由 .env.server 设置。
name: ${DEPLOY_PROJECT:-tianshu}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.6}
    cpus: "${MYSQL_CPU_LIMIT:-0.40}"
    mem_limit: "${MYSQL_MEMORY_LIMIT:-1536m}"
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPU_LIMIT:-0.40}"
          memory: "${MYSQL_MEMORY_LIMIT:-1536m}"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-rule_engine}"
      MYSQL_USER: "${MYSQL_USERNAME:?Set MYSQL_USERNAME}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      TZ: Asia/Shanghai
    command:
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-300}
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-1G}
      - --max-allowed-packet=512M
      - --character-set-server=utf8mb4
      - --mysql-native-password=ON
      - --bind-address=0.0.0.0
    ports:
      - "${MYSQL_BIND_ADDRESS:-0.0.0.0}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ./rule-engine-mysql/data:/var/lib/mysql
      - ./rule-engine-mysql/logs:/var/log/mysql
      - ./rule-engine-mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    networks: [rule-engine]

  example-provision:
    extends: {file: credit-example.compose.yml, service: example-provision}
    depends_on:
      mysql: {condition: service_healthy}

  example-supplier:
    extends: {file: credit-example.compose.yml, service: example-supplier}
    depends_on:
      example-provision: {condition: service_completed_successfully}
    environment:
      EXAMPLE_ENGINE_URLS: "${EXAMPLE_ENGINE_URLS:-${EXAMPLE_ENGINE_URL:-http://host.docker.internal:8080}}"
      EXAMPLE_ENGINE_URL: ${EXAMPLE_ENGINE_URL:-http://host.docker.internal:8080}
    ports:
      - "127.0.0.1:${EXAMPLE_HTTP_PORT:-28084}:28084"
      - "127.0.0.1:${EXAMPLE_SFTP_PORT:-22084}:22084"

  example-data-import:
    extends: {file: credit-example.compose.yml, service: example-data-import}
    depends_on:
      example-supplier: {condition: service_started}
    environment:
      EXAMPLE_ENGINE_URL: ${EXAMPLE_ENGINE_URL:-http://host.docker.internal:8080}
      EXAMPLE_DB_HOST: ${EXAMPLE_DB_HOST:-127.0.0.1}
      EXAMPLE_DB_PORT: ${EXAMPLE_DB_PORT:-${MYSQL_HOST_PORT:-3306}}
      EXAMPLE_SUPPLIER_HOST: ${EXAMPLE_SUPPLIER_HOST:-127.0.0.1}

volumes:
  example-credentials:
  model-files:
  example-supplier-receipts:
  example-supplier-credentials:

networks:
  rule-engine:
    name: ${ENGINE_NETWORK:-${DEPLOY_PROJECT:-tianshu}-engine}
    driver: bridge
