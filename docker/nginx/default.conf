# web 同时提供控制台和 server 集群入口；TLS 由 Nginx Proxy Manager 终止。
resolver 127.0.0.11 valid=5s ipv6=off;
upstream tianshu_servers {
    zone tianshu_servers 64k;
    least_conn;
    server server:8080 resolve max_fails=2 fail_timeout=5s;
    keepalive 16;
}
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;
    # 静态代码、样式和地图按需压缩，避免低带宽环境按原始大小传输。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json application/geo+json image/svg+xml font/ttf application/wasm;
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # 文件名带内容摘要，更新构建会更换 URL，可长期缓存且不混用旧代码。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /loading.css {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/vs/css!vs/(.*)$ { rewrite ^/vs/css!vs/(.*)$ /vs/$1 break; }
    location ~ ^/vs/nls!vs/(.*\.js)$ { rewrite ^/vs/nls!vs/(.*\.js)$ /vs/$1 break; }
    location ~ ^/vs/nls!vs/(.*)$ { rewrite ^/vs/nls!vs/(.*)$ /vs/$1.js break; }
    location /api/ {
        include /etc/nginx/tianshu-proxy.conf;
    }
    location / { try_files $uri $uri/ /index.html; }
}
# 内网业务调用方、Java SDK 和宿主机诊断入口，不在 NPM 上公开 actuator。
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 512m;
    location / { include /etc/nginx/tianshu-proxy.conf; }
}
