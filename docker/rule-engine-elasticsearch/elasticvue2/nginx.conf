# $request_uri retains the original escaped document ID and query string.
map $request_uri $elasticvue_cluster_request {
    ~^/es/backend(/.*)$ $1;
    default "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /es { return 308 /es/$is_args$args; }
    location = /es/backend { return 308 /es/backend/$is_args$args; }

    location ^~ /es/backend/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $cluster elasticsearch:9200;
        if ($elasticvue_cluster_request = "") { return 400; }
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # The page handles 401 responses with its own username/password form.
        proxy_hide_header WWW-Authenticate;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://$cluster$elasticvue_cluster_request;
    }

    location /es/assets/ { try_files $uri =404; }
    location = /es/index.html { add_header Cache-Control "no-cache"; }
    location /es/ { try_files $uri $uri/ /es/index.html; }
    location / { return 404; }
}
