# 保留原始转义及查询串，包括含 %2F 的文档 ID。
map $request_uri $cluster_uri {
    ~^/es(/.*)$ $1;
    default "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 使用浏览器提供的 ES 凭据。同源访问无需开放集群 CORS。
    location /es/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $cluster elasticsearch:9200;
        proxy_set_header Cookie "";
        proxy_pass http://$cluster$cluster_uri;
    }
}
