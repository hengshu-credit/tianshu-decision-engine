name: Publish frontend operation manual

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy operation manual
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload manual
        id: manual
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs

      - name: Deploy uploaded manual
        id: deployment
        uses: actions/github-script@v8
        timeout-minutes: 10
        env:
          ARTIFACT_ID: ${{ steps.manual.outputs.artifact_id }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const artifact = Number(process.env.ARTIFACT_ID)
            if (!Number.isSafeInteger(artifact) || artifact <= 0) throw new Error('Upload returned no artifact ID')
            const { data } = await github.rest.repos.createPagesDeployment({
              ...context.repo, artifact_id: artifact, pages_build_version: process.env.BUILD_SHA,
              oidc_token: await core.getIDToken()
            })
            const deployment = data.id || process.env.BUILD_SHA
            for (;;) {
              const { data: report } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...context.repo, pages_deployment_id: deployment
              })
              if (report.status === 'succeed') break
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
                   'deployment_cancelled', 'deployment_lost'].includes(report.status)) {
                throw new Error('Pages deployment ' + deployment + ': ' + report.status)
              }
              await new Promise(resolve => setTimeout(resolve, 5000))
            }
            core.setOutput('page_url', data.page_url)
