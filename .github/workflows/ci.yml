name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-comments:
    name: Schema comments (MySQL 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: schema_check
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        options: >-
          --health-cmd="mysql --protocol=tcp -h127.0.0.1 -uroot -Dschema_check -e 'SELECT 1'"
          --health-interval=3s --health-timeout=3s --health-retries=40
    steps:
      - uses: actions/checkout@v5
      - name: Check comments on all tables and columns
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          mysql=(docker exec -i "$MYSQL_CONTAINER" mysql -uroot --default-character-set=utf8mb4 --batch --skip-column-names schema_check)
          "${mysql[@]}" < rule-engine-server/src/main/resources/sql/schema.sql > /dev/null
          missing=$("${mysql[@]}" < scripts/quality-gates/check-schema-comments.sql)
          if [[ -n "$missing" ]]; then
            printf '缺少中文注释的表或字段\n%s\n' "$missing"
            exit 1
          fi
      - name: Verify comment migration preserves existing column definitions
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          mysql=(docker exec -i "$MYSQL_CONTAINER" mysql -uroot --default-character-set=utf8mb4 --batch --skip-column-names schema_check)
          dump=(docker exec "$MYSQL_CONTAINER" mysqldump -uroot --no-data --skip-triggers --no-tablespaces --set-gtid-purged=OFF schema_check)
          sql_dir=rule-engine-server/src/main/resources/sql
          generate=(python3 "$sql_dir/migrations/2026-11-11-schema-comments.py" "$sql_dir/schema.sql" "$RUNNER_TEMP/schema-dump.sql")
          column="update_by VARCHAR(83) COLLATE utf8mb4_bin NOT NULL DEFAULT 'legacy\\\\path'"
          comment=$("${mysql[@]}" -e "SELECT QUOTE(COLUMN_COMMENT) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='rule_dashboard_default' AND COLUMN_NAME='update_by'")
          "${mysql[@]}" -e "ALTER TABLE rule_dashboard_default MODIFY $column COMMENT $comment"
          expected=$("${mysql[@]}" -e 'SHOW CREATE TABLE rule_dashboard_default')
          "${mysql[@]}" -e "ALTER TABLE rule_dashboard_default COMMENT='dashboard', MODIFY $column COMMENT 'operator'"
          "${dump[@]}" > "$RUNNER_TEMP/schema-dump.sql"
          "${generate[@]}" > "$RUNNER_TEMP/schema-comments.sql"
          "${mysql[@]}" --init-command="SET SESSION sql_mode=CONCAT_WS(',',NULLIF(@@SESSION.sql_mode,''),'NO_BACKSLASH_ESCAPES')" < "$RUNNER_TEMP/schema-comments.sql"
          actual=$("${mysql[@]}" -e 'SHOW CREATE TABLE rule_dashboard_default')
          [[ "$actual" == "$expected" ]]
          "${dump[@]}" > "$RUNNER_TEMP/schema-dump.sql"
          "${generate[@]}" > "$RUNNER_TEMP/schema-comments.sql"
          test ! -s "$RUNNER_TEMP/schema-comments.sql"

  quality-gates:
    name: Runtime quality-gate scripts (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test runtime quality-gate scripts
        run: |
          npm ci --prefix scripts/quality-gates --ignore-scripts
          npm test --prefix scripts/quality-gates

  backend:
    name: Backend (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --shm-size=1g
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rule-engine-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rule-engine-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Verify bundled Chromium
        run: node -e "const fs = require('node:fs'); fs.accessSync(require('playwright').chromium.executablePath(), fs.constants.X_OK)"
      - name: Run dist E2E
        run: npm run test:e2e:dist
      - name: Upload navigation timings and errors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: navigation-audit
          path: rule-engine-web/test-results/**/navigation-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failures
          path: rule-engine-web/test-results
          if-no-files-found: ignore
          retention-days: 7

