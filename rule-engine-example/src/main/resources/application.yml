server:
  # 默认只在本机提供联调页；对外暴露请通过业务网关配置 TLS、鉴权和限流。
  address: ${EXAMPLE_BIND_ADDRESS:127.0.0.1}
  port: ${EXAMPLE_PORT:7070}
spring:
  application:
    name: tianshu-java-example
  config:
    import: optional:file:./config/example.properties
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
