<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:24px 12px;background:#f6f8fc;color:#243248;font-family:Arial,Microsoft YaHei,sans-serif">
<table role="presentation" style="width:100%;max-width:640px;margin:auto;background:#fff;border:1px solid #e6e9f0;border-radius:10px"><tr><td style="padding:24px">
  <table role="presentation" style="width:100%;border-bottom:2px solid #2934ea"><tr>
    <td style="font-size:21px;font-weight:bold;padding-bottom:16px">{{title}}</td>
    <td align="right" style="padding-bottom:16px"><table role="presentation"><tr>
      <td><img src="{{logo}}" alt="{{name}}" width="32" height="32" style="object-fit:contain"></td>
      <td style="padding-left:8px;font-size:13px">{{name}}<br><span style="font-size:11px;color:#2934ea">{{subtitle}}</span></td>
    </tr></table></td>
  </tr></table>
  <div style="font-size:14px;line-height:1.8"><p>尊敬的{{username}}：</p><p>{{text}}</p>{{action}}</div>
  <table role="presentation" style="width:100%;border-top:1px solid #e6e9f0;margin-top:18px;font-size:12px;color:#657087"><tr>
    <td style="padding-top:12px">上海衡枢真信科技有限公司</td>
    <td align="right" style="padding-top:12px"><a href="https://www.hengshucredit.com" style="color:#2934ea;text-decoration:none">www.hengshucredit.com</a></td>
  </tr></table>
</td></tr></table>
</body></html>
