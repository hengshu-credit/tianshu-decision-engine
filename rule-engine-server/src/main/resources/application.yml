server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: rule-engine-server
  config:
    # 仓库根目录启动时读取 ./.env；从 rule-engine-server 目录启动时读取 ../.env。
    # 操作系统环境变量和命令行参数的优先级仍高于这些本地配置。
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 含数据库名，${MYSQL_DATABASE} 可通过环境变量或配置文件注入
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:rule_engine}?useUnicode=true&allowMultiQueries=${MYSQL_ALLOW_MULTI_QUERIES:false}&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      schema-locations: classpath:sql/schema.sql
      encoding: UTF-8
      mode: ${SPRING_SQL_INIT_MODE:${SPRING_DATASOURCE_INITIALIZATION_MODE:always}}
      continue-on-error: ${SPRING_SQL_INIT_CONTINUE_ON_ERROR:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 无密码时留空或删除本行
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
        shutdown-timeout: 200ms
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:60m}
    redis:
      namespace: ${SESSION_REDIS_NAMESPACE:tianshu:session}

rule-engine:
  log-retention:
    # 默认永久保留业务审计日志；生产按部署策略显式开启并设置各类天数。
    enabled: ${RULE_LOG_RETENTION_ENABLED:false}
    interval-ms: ${RULE_LOG_RETENTION_INTERVAL_MS:86400000}
    batch-size: ${RULE_LOG_RETENTION_BATCH_SIZE:1000}
    max-batches-per-table: ${RULE_LOG_RETENTION_MAX_BATCHES_PER_TABLE:10}
    query-timeout-seconds: ${RULE_LOG_RETENTION_QUERY_TIMEOUT_SECONDS:5}
    auth-access-log-days: ${RULE_AUTH_ACCESS_LOG_RETENTION_DAYS:0}
  trace:
    # 仅限制持久化日志中的追踪 JSON；请求结果和内存追踪不截断。
    max-persist-bytes: ${RULE_TRACE_MAX_PERSIST_BYTES:1048576}
    # 仅遮罩持久化追踪副本，逗号分隔 JSONPath，例如 $.input.idCard,$.items[*].phone。
    mask-paths: ${RULE_TRACE_MASK_PATHS:}
  source-resolution:
    parallelism: ${SOURCE_RESOLUTION_PARALLELISM:4}
  onnx:
    # 8 种任务各保留 CPU 检查与一种运行配置；仅限制会话数量，不等于 native/显存字节预算。
    # 满额优先释放最久未用的空闲会话，全部在用时明确拒绝新的模型/运行配置。
    session-cache-max-entries: ${ONNX_SESSION_CACHE_MAX_ENTRIES:16}
  execution-persistence:
    queue-capacity: ${RULE_EXECUTION_PERSISTENCE_QUEUE_CAPACITY:5000}
    # 请求先提交恢复 outbox；不可写时改用本地写前日志，目录应放在独立持久化盘。
    journal-enabled: ${RULE_EXECUTION_PERSISTENCE_JOURNAL_ENABLED:true}
    journal-dir: ${RULE_EXECUTION_PERSISTENCE_JOURNAL_DIR:./logs/execution-persistence-journal}
    # 含版本/摘要封装和行尾换行的实际UTF-8字节数，不只是内部Entry载荷。
    journal-max-entry-bytes: ${RULE_EXECUTION_PERSISTENCE_JOURNAL_MAX_ENTRY_BYTES:10485760}
    journal-replay-delay-ms: ${RULE_EXECUTION_PERSISTENCE_JOURNAL_REPLAY_DELAY_MS:5000}
    journal-replay-batch-size: ${RULE_EXECUTION_PERSISTENCE_JOURNAL_REPLAY_BATCH_SIZE:1000}
  list-actions:
    journal-dir: ${RULE_LIST_ACTION_JOURNAL_DIR:./logs/list-action-journal}
  cors:
    # 生产环境必须通过环境变量配置为实际控制台域名，多个来源使用英文逗号分隔
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:${VITE_PORT:9090},http://127.0.0.1:${VITE_PORT:9090}}
  project-auth:
    active-key-id: ${RULE_AUTH_ACTIVE_KEY_ID:v2}
    master-keys:
      v1: ${RULE_AUTH_LEGACY_MASTER_KEY:}
      v2: ${RULE_AUTH_MASTER_KEY:}
      legacy-v2: ${RULE_AUTH_LEGACY_V2_MASTER_KEY:}
    hmac-time-window-seconds: 300
    token-failure-limit: 10
    token-failure-window-seconds: 300
    token-lock-seconds: 900
  # Kafka 日志消费默认关闭；显式配置 broker 和主题到项目 ID 的绑定，参见 docs/kafka-execution-logs.md。
  kafka:
    enabled: ${RULE_KAFKA_ENABLED:false}
    group-id: ${RULE_KAFKA_GROUP_ID:rule-engine-server}
    topic-projects: {}
    max-retries: 2
    retry-interval-ms: 1000
  # 管理端（Vue 控制台）用户名密码登录；false 时不校验会话，与改造前行为一致
  console-login:
    enabled: true
    # 需会话校验的路径（Ant）；默认覆盖管理 API
    include-patterns:
      - /api/rule/**
    # 匿名放行：同步、日志上报、认证接口等
    exclude-patterns:
      - /api/auth/**
      - /api/rule/auth/token
      - /api/rule/sync/**
      - /api/rule/openapi/**
      - /api/rule/log/report
    session-username-attribute: RULE_CONSOLE_USERNAME
    # 未自定义 ConsoleLoginAuthenticator Bean 时使用以下账号登录；生产环境请改为环境变量或 BCrypt
    builtin:
      username: ${CONSOLE_USERNAME:}
      password: ${CONSOLE_PASSWORD:}
      password-encoding: ${CONSOLE_PASSWORD_ENCODING:BCRYPT}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,onnxWarmup,ruleWarmup
